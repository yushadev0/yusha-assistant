[project]
name = "yusha-assistant"
version = "0.1.0"
description = "Kişisel Telegram botu — VPS izleme, servis kontrolü, (ileride) Minecraft yönetimi"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6,<22",
    "aiodocker>=0.23,<0.25",
    "asyncssh>=2.17,<3",
    "psutil>=6.1,<7",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
yusha = "yusha.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yusha"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psutil",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
